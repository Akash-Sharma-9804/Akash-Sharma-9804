<svg width="680" height="400" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Akash Sharma — About Me terminal</title>
  <desc>macOS-style terminal window showing Akash Sharma's developer profile as a JavaScript object with syntax highlighting</desc>

  <!-- Window body -->
  <rect x="0" y="0" width="680" height="400" rx="10" fill="#1C1C1E"/>
  <!-- Title bar -->
  <rect x="0" y="0" width="680" height="36" rx="10" fill="#2C2C2E"/>
  <rect x="0" y="24" width="680" height="12" fill="#2C2C2E"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="50" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="72" cy="18" r="6" fill="#28C840"/>

  <!-- Title bar text -->
  <text x="340" y="23" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11" fill="#8A8A8E" text-anchor="middle">akash@portfolio — ~/about-me — zsh</text>

  <!-- Command line -->
  <text x="24" y="66" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#28C840">❯</text>
  <text x="42" y="66" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#6AD3F7">node</text>
  <text x="82" y="66" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2"> about-me.js</text>

  <!-- const akash = { -->
  <text x="24" y="96" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#C678DD">const</text>
  <text x="66" y="96" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75"> akash</text>
  <text x="114" y="96" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#56B6C2"> =</text>
  <text x="130" y="96" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2"> {</text>

  <!-- name -->
  <text x="44" y="120" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">name</text>
  <text x="80" y="120" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="120" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"Akash Sharma"</text>
  <text x="310" y="120" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- location -->
  <text x="44" y="144" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">location</text>
  <text x="112" y="144" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="144" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"Kolkata, India 🇮🇳"</text>
  <text x="358" y="144" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- role -->
  <text x="44" y="168" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">role</text>
  <text x="80" y="168" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="168" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"Full-Stack Developer"</text>
  <text x="396" y="168" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- company -->
  <text x="44" y="192" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">company</text>
  <text x="104" y="192" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="192" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"QuantumHash Corporation"</text>
  <text x="452" y="192" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- experience -->
  <text x="44" y="216" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">experience</text>
  <text x="128" y="216" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="216" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"1+ year (production)"</text>
  <text x="390" y="216" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- building -->
  <text x="44" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">building</text>
  <text x="112" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">: [</text>
  <text x="148" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"AI platforms"</text>
  <text x="280" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">, </text>
  <text x="297" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"REST APIs"</text>
  <text x="391" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">, </text>
  <text x="408" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"Vector Search"</text>
  <text x="533" y="240" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">],</text>

  <!-- funFact -->
  <text x="44" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">funFact</text>
  <text x="104" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"800ms API response</text>
  <text x="358" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#56B6C2"> →</text>
  <text x="380" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379"> 450ms"</text>
  <text x="444" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#FEBC2E"> ⚡</text>
  <text x="464" y="264" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- contact -->
  <text x="44" y="288" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E06C75">contact</text>
  <text x="104" y="288" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">:</text>
  <text x="148" y="288" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#98C379">"akashsharma9804@gmail.com"</text>
  <text x="480" y="288" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">,</text>

  <!-- }; -->
  <text x="24" y="312" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#E2E2E2">};</text>

  <!-- Next prompt with blinking cursor -->
  <text x="24" y="348" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" fill="#28C840">❯</text>
  <rect x="42" y="335" width="8" height="16" fill="#E2E2E2">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
